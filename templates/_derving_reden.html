{# Alleen bij 'Uit': was het breuk of weggegooid? Dan komt het in het derving-overzicht (zie derving.py). #}
<div class="veld derving-reden" hidden>
    <label for="reden">Was het breuk, bedorven of weggegeven? (optioneel)</label>
    <select id="reden" name="reden">
        <option value="">Nee, gewoon verkocht of verbruikt</option>
        {% for sleutel, naam in derving_redenen.items() %}<option value="{{ sleutel }}">{{ naam }}</option>{% endfor %}
    </select>
</div>
<script>
(function () {
    // Luistert op document en niet per formulier: na een boeking ververst _boeking_formulier_script.html de inhoud,
    // en dan draait dit script niet opnieuw. De keuze in of uit moet het veld daarna nog steeds tonen of verbergen.
    function bijwerken(formulier) {
        var veld = formulier && formulier.querySelector('.derving-reden');
        if (!veld) return;
        var uit = formulier.querySelector('input[name=type][value=uit]');
        veld.hidden = !(uit && uit.checked);
        if (veld.hidden) veld.querySelector('select').value = '';
    }
    if (!window.dervingRedenBewaakt) {
        window.dervingRedenBewaakt = true;
        document.addEventListener('change', function (e) {
            if (e.target.name === 'type') bijwerken(e.target.form);
        });
    }
    bijwerken(document.currentScript.closest('form'));
})();
</script>
