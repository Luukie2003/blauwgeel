<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen · Kantine Beheer</title>
    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Kantine Beheer">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ css_versie }}">
</head>
<body class="login-body">
    <div class="login-wrap">
        <div class="login-venster">
            <div class="app-titelbalk">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="s.v. Blauw-Geel 1915" class="titelbalk-logo">
                <span>Kantine Beheer — Aanmelden</span>
            </div>
            <div class="login-logo-groot">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="s.v. Blauw-Geel 1915">
            </div>
            <div class="login-inhoud">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        <div class="flashes">
                            {% for category, message in messages %}
                                <div class="flash flash-{{ category }}">{{ message }}</div>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}
                <form method="post">
                    <div class="veld">
                        <label for="naam">Gebruikersnaam</label>
                        <input type="text" id="naam" name="naam" autocomplete="username" autofocus required>
                    </div>
                    <div class="veld">
                        <label for="wachtwoord">Wachtwoord</label>
                        <input type="password" id="wachtwoord" name="wachtwoord" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-geel login-btn">Aanmelden</button>
                </form>
                <p class="subtitel" style="text-align:center; margin-top:1rem">
                    <a href="{{ url_for('wachtwoord_vergeten') }}">Wachtwoord vergeten?</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
