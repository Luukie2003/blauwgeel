{% extends "base.html" %}
{% block titel %}Nieuwe stemming{% endblock %}
{% block inhoud %}
<h1>Nieuwe stemming</h1>
<p class="subtitel"><a href="{{ url_for('stemmen_overzicht') }}">&larr; Terug naar stemmen</a></p>

<div class="kaart" style="max-width:640px">
    <form method="post" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="veld">
            <label for="titel">Vraag</label>
            <input type="text" id="titel" name="titel" required
                   placeholder="Bijv. 'Welk fust willen jullie voor het weizen bier?'">
        </div>
        <div class="veld">
            <label for="omschrijving">Toelichting (optioneel)</label>
            <textarea id="omschrijving" name="omschrijving" rows="2"
                      placeholder="Extra uitleg voor wie stemt"></textarea>
        </div>
        <fieldset class="groupbox">
            <legend>Keuzes</legend>
            <p class="tekst-zacht" style="margin-top:0">
                Minstens 2, lege velden worden genegeerd. Een afbeelding per keuze is optioneel.
            </p>
            {% for i in range(1, 6) %}
            <div class="formgrid" style="margin-bottom:0.6rem">
                <div class="veld">
                    <label for="optie{{ i }}">Keuze {{ i }}{{ '' if i <= 2 else ' (optioneel)' }}</label>
                    <input type="text" id="optie{{ i }}" name="optie{{ i }}" {{ 'required' if i <= 2 }}
                           placeholder="{{ ('Bijv. Fust ' ~ 'ABC'[i-1]) if i <= 3 else '' }}">
                </div>
                <div class="veld">
                    <label for="afbeelding{{ i }}">Afbeelding (optioneel)</label>
                    <input type="file" id="afbeelding{{ i }}" name="afbeelding{{ i }}" accept="image/*">
                </div>
            </div>
            {% endfor %}
        </fieldset>
        <button type="submit" class="btn btn-geel">Stemming aanmaken</button>
    </form>
</div>
{% endblock %}
