<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wachtwoord instellen · Kantine Voorraadbeheer</title>
    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ css_versie }}">
</head>
<body class="login-body">
    <div class="login-wrap">
        <div class="login-venster">
            <div class="app-titelbalk">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="s.v. Blauw-Geel 1915" class="titelbalk-logo">
                <span>Kantine Voorraadbeheer — Wachtwoord instellen</span>
            </div>
            <div class="login-logo-groot">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="s.v. Blauw-Geel 1915">
            </div>
            <div class="login-inhoud">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        <div class="flashes">
                            {% for category, message in messages %}
                                <div class="flash flash-{{ category }}">{{ message }}</div>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}
                <p class="subtitel" style="margin-top:0">
                    Kies een wachtwoord voor <strong>{{ gebruiker.naam }}</strong>.
                </p>
                <form method="post">
                    <div class="veld">
                        <label for="nieuw_wachtwoord">Nieuw wachtwoord</label>
                        <input type="password" id="nieuw_wachtwoord" name="nieuw_wachtwoord" autofocus required minlength="4">
                    </div>
                    <div class="veld">
                        <label for="nieuw_wachtwoord_herhaald">Nieuw wachtwoord (herhalen)</label>
                        <input type="password" id="nieuw_wachtwoord_herhaald" name="nieuw_wachtwoord_herhaald" required minlength="4">
                    </div>
                    <button type="submit" class="btn btn-geel login-btn">Wachtwoord instellen</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
