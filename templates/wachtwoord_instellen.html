{% extends "base_inlog.html" %}
{% block titel %}Wachtwoord instellen{% endblock %}
{% block kop %}Wachtwoord instellen{% endblock %}
{% block uitleg %}<p class="cs-ingang-uitleg">Kies een wachtwoord voor <strong>{{ gebruiker.naam }}</strong>.</p>{% endblock %}
{% block inhoud %}
<form method="post" class="cs-ingang-formulier">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="veld">
        <label for="nieuw_wachtwoord">Nieuw wachtwoord</label>
        <input type="password" id="nieuw_wachtwoord" name="nieuw_wachtwoord" autocomplete="new-password" autofocus required minlength="4">
    </div>
    <div class="veld">
        <label for="nieuw_wachtwoord_herhaald">Nieuw wachtwoord (herhalen)</label>
        <input type="password" id="nieuw_wachtwoord_herhaald" name="nieuw_wachtwoord_herhaald" autocomplete="new-password" required minlength="4">
    </div>
    <button type="submit" class="btn btn-geel">Wachtwoord opslaan</button>
</form>
{% endblock %}
