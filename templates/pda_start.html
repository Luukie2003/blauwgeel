{% extends "base_pda.html" %}
{% block titel %}Start{% endblock %}
{% block inhoud %}
<div class="pda-groet-kop">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="" class="pda-groet-logo">
    <div class="pda-groet-tekst">
        <strong>{{ groet }}, {{ huidige_gebruiker }}</strong>
        <span class="tekst-zacht">Wat wil je doen?</span>
    </div>
</div>

<div class="pda-menu">
    <a href="{{ url_for('tellen') }}" class="pda-menu-knop">
        <span class="pda-menu-icoon-cirkel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M9 13l2 2 4-4"/></svg>
        </span>
        <span class="pda-menu-label">Tellen</span>
    </a>
    <a href="{{ url_for('boeken') }}" class="pda-menu-knop">
        <span class="pda-menu-icoon-cirkel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
        </span>
        <span class="pda-menu-label">Boeken</span>
    </a>
    <a href="{{ url_for('bijzonderheden') }}" class="pda-menu-knop">
        <span class="pda-menu-icoon-cirkel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3 1-5a8 8 0 1 1 17-6z"/></svg>
        </span>
        <span class="pda-menu-label">Prikbord</span>
    </a>
    <a href="{{ url_for('kassa_tellen') }}" class="pda-menu-knop">
        <span class="pda-menu-icoon-cirkel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="13" rx="2"/><path d="M2 11h20"/><circle cx="12" cy="15" r="2"/></svg>
        </span>
        <span class="pda-menu-label">Kassa</span>
    </a>
    <a href="{{ url_for('bestellijst') }}" class="pda-menu-knop">
        <span class="pda-menu-icoon-cirkel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/><path d="M3 4h2l2.4 11.6a2 2 0 0 0 2 1.6h7.4a2 2 0 0 0 2-1.6L21 8H6"/></svg>
        </span>
        <span class="pda-menu-label">Bestellijst</span>
    </a>
    <a href="{{ url_for('geschiedenis') }}" class="pda-menu-knop">
        <span class="pda-menu-icoon-cirkel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>
        </span>
        <span class="pda-menu-label">Geschiedenis</span>
    </a>
</div>

<div class="pda-start-footer">
    <a href="{{ url_for('weergave_desktop') }}">Desktop versie openen</a>
</div>
{% endblock %}
