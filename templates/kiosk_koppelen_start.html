<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tv koppelen · s.v. Blauw-Geel 1915</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <meta name="theme-color" content="#1e3a8a">
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(160deg, #1e3a8a 0%, #0f1f4d 100%); color: #b9c2e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Calibri, sans-serif; font-size: 1.4rem;
        }
    </style>
</head>
<body>
    <p>Even geduld&hellip;</p>
    {# Een nieuwe tv krijgt hier zijn eigen token (willekeurig, bewaard in de tv zelf) en gaat naar zijn eigen adres
       /kiosk/t/<token>: daar staat de koppelcode, of (al gekoppeld) wat de tv moet tonen. Zie kiosk_tvs.py. #}
    <script>
    (function () {
        var sleutel = 'kantine_tv_token';
        var token = null;
        try { token = localStorage.getItem(sleutel); } catch (e) {}
        if (!token || !/^[A-Za-z0-9_-]{16,64}$/.test(token)) {
            var tekens = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            var willekeurig = new Uint8Array(24);
            window.crypto.getRandomValues(willekeurig);
            token = '';
            for (var i = 0; i < willekeurig.length; i++) token += tekens.charAt(willekeurig[i] % tekens.length);
            try { localStorage.setItem(sleutel, token); } catch (e) {}
        }
        location.replace({{ url_for('kiosk_tv_scherm', token='TOKEN')|tojson }}.replace('TOKEN', token));
    })();
    </script>
</body>
</html>
