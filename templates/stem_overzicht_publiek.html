<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stemmen · s.v. Blauw-Geel 1915</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <meta name="theme-color" content="#1e3a8a">
    <style>
        :root {
            --blauw: #1e3a8a;
            --blauw-donker: #0f1f4d;
            --geel: #fcd42f;
            --geel-donker: #e0ba17;
            --tekst-zacht: #6b7280;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Calibri, sans-serif;
            background: linear-gradient(160deg, var(--blauw) 0%, var(--blauw-donker) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .stemkaart {
            background: #fff;
            border-radius: 22px;
            padding: 2rem 1.75rem 2.25rem;
            max-width: 26rem;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            text-align: center;
        }
        .stemkaart img.logo { width: 4.5rem; height: auto; margin-bottom: 0.9rem; }
        .stemkaart .club { color: var(--tekst-zacht); font-size: 0.8rem; letter-spacing: 0.03em; text-transform: uppercase; font-weight: 700; margin: 0 0 0.4rem; }
        .stemkaart h1 { font-size: 1.4rem; color: var(--blauw-donker); margin: 0 0 1.2rem; line-height: 1.3; }
        .stemming-link {
            display: block;
            text-align: left;
            width: 100%;
            background: #f4f6fb;
            border: 2px solid #e3e7f2;
            border-radius: 14px;
            padding: 0.9rem 1.1rem;
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--blauw-donker);
            text-decoration: none;
            margin-bottom: 0.7rem;
            transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
        }
        .stemming-link:hover { border-color: var(--geel); background: #fffbea; }
        .stemming-link:active { transform: scale(0.98); }
        .stemming-link .pijl { float: right; color: var(--geel-donker); }
        .leeg { color: var(--tekst-zacht); font-size: 0.95rem; }
        .leeg .emoji { font-size: 2.2rem; display: block; margin-bottom: 0.5rem; }
        .voetnoot { color: var(--tekst-zacht); font-size: 0.75rem; margin-top: 1.4rem; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="stemkaart">
        <img class="logo" src="{{ url_for('static', filename='logo.png') }}" alt="s.v. Blauw-Geel 1915">
        <p class="club">s.v. Blauw-Geel 1915</p>
        <h1>Stemmen</h1>

        {% if stemmingen %}
        {% for v in stemmingen %}
        <a class="stemming-link" href="{{ url_for('stem_pagina', stemvraag_id=v.id) }}">
            <span class="pijl">&rarr;</span>{{ v.titel }}
        </a>
        {% endfor %}
        {% else %}
        <p class="leeg"><span class="emoji">🗳️</span>Op dit moment zijn er geen open stemmingen. Kom later nog eens terug!</p>
        {% endif %}

        <p class="voetnoot">Kantine Beheer &middot; s.v. Blauw-Geel 1915</p>
    </div>
</body>
</html>
